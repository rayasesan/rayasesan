<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="900" height="220" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <circle cx="780" cy="40" r="180" fill="url(#glow1)"/>
    <circle cx="60" cy="200" r="140" fill="url(#glow1)"/>

    <text x="60" y="98" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="0.3">
      Raya Sesan Firdaus
    </text>
    <text x="60" y="132" font-family="Segoe UI, Verdana, sans-serif" font-size="19" font-weight="500" fill="#c7d2fe">
      Data Scientist &amp; Machine Learning Enthusiast
    </text>

    <g font-family="Segoe UI, Verdana, sans-serif" font-size="13" font-weight="600" fill="#0e1130">
      <rect x="60" y="156" width="76" height="28" rx="14" fill="url(#accent)"/>
      <text x="98" y="174" text-anchor="middle">Python</text>

      <rect x="146" y="156" width="60" height="28" rx="14" fill="url(#accent)"/>
      <text x="176" y="174" text-anchor="middle">SQL</text>

      <rect x="216" y="156" width="52" height="28" rx="14" fill="url(#accent)"/>
      <text x="242" y="174" text-anchor="middle">ML</text>

      <rect x="278" y="156" width="94" height="28" rx="14" fill="url(#accent)"/>
      <text x="325" y="174" text-anchor="middle">Power BI</text>
    </g>

    <rect x="0" y="0" width="900" height="220" fill="none" stroke="#ffffff" stroke-opacity="0.08" rx="18"/>
  </g>
</svg>
