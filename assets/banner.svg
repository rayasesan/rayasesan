<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Monaco, monospace">
  <defs>
    <clipPath id="clip"><rect width="900" height="280" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="#1e1e2e"/>

    <!-- title bar -->
    <rect width="900" height="38" fill="#181825"/>
    <circle cx="24" cy="19" r="6" fill="#f38ba8"/>
    <circle cx="46" cy="19" r="6" fill="#f9e2af"/>
    <circle cx="68" cy="19" r="6" fill="#a6e3a1"/>
    <rect x="140" y="8" width="120" height="22" rx="5" fill="#11111b"/>
    <text x="200" y="23" font-size="12" fill="#cdd6f4" text-anchor="middle">raya.py</text>

    <!-- line numbers -->
    <text x="20" y="70" font-size="15" fill="#585b70">1</text>
    <text x="20" y="96" font-size="15" fill="#585b70">2</text>
    <text x="20" y="122" font-size="15" fill="#585b70">3</text>
    <text x="20" y="148" font-size="15" fill="#585b70">4</text>
    <text x="20" y="174" font-size="15" fill="#585b70">5</text>
    <text x="20" y="200" font-size="15" fill="#585b70">6</text>
    <text x="20" y="226" font-size="15" fill="#585b70">7</text>
    <text x="20" y="252" font-size="15" fill="#585b70">8</text>

    <!-- code -->
    <text x="50" y="70" font-size="17">
      <tspan fill="#cba6f7">class</tspan>
      <tspan fill="#f9e2af"> Raya</tspan>
      <tspan fill="#cdd6f4">:</tspan>
    </text>

    <text x="70" y="96" font-size="17">
      <tspan fill="#cba6f7">def</tspan>
      <tspan fill="#89b4fa"> __init__</tspan>
      <tspan fill="#cdd6f4">(self):</tspan>
    </text>

    <text x="90" y="122" font-size="17">
      <tspan fill="#cdd6f4">self.name = </tspan>
      <tspan fill="#a6e3a1">"Raya Sesan Firdaus"</tspan>
    </text>

    <text x="90" y="148" font-size="17">
      <tspan fill="#cdd6f4">self.role = </tspan>
      <tspan fill="#a6e3a1">"Data Scientist"</tspan>
    </text>

    <text x="90" y="174" font-size="17">
      <tspan fill="#cdd6f4">self.stack = [</tspan>
      <tspan fill="#a6e3a1">"Python"</tspan>
      <tspan fill="#cdd6f4">, </tspan>
      <tspan fill="#a6e3a1">"SQL"</tspan>
      <tspan fill="#cdd6f4">, </tspan>
      <tspan fill="#a6e3a1">"Power BI"</tspan>
      <tspan fill="#cdd6f4">]</tspan>
    </text>

    <text x="90" y="200" font-size="17">
      <tspan fill="#f38ba8">while</tspan>
      <tspan fill="#cdd6f4"> True:</tspan>
    </text>

    <text x="110" y="226" font-size="17">
      <tspan fill="#cdd6f4">self.</tspan>
      <tspan fill="#89b4fa">learn</tspan>
      <tspan fill="#cdd6f4">()</tspan>
    </text>

    <text x="50" y="252" font-size="17">
      <tspan fill="#6c7086"># turning data into decisions</tspan>
    </text>

    <rect x="303" y="180" width="10" height="20" fill="#a6e3a1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
